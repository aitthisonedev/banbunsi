services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: banbunsi
      POSTGRES_PASSWORD: banbunsi
      POSTGRES_DB: banbunsi
    ports:
      - "5432:5432"
    volumes:
      - banbunsi_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banbunsi -d banbunsi"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  banbunsi_pg:
