server {
    listen 80;
    server_name __SERVER_NAME__;
    client_max_body_size 20m;

    location /uploads/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    # Document file uploads stream straight to the API: larger body limit and no buffering, on
    # this route only (everything else keeps the 20m limit). Keep in step with MAX_UPLOAD_MB.
    location ~ ^/api/v1/admin/documents/[^/]+/files$ {
        client_max_body_size 105m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
