name: CI and production deployment

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banbunsi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      stale: ${{ steps.commit.outputs.stale }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: npm ci
        working-directory: apps/web
      - name: Format changed files and commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; its workflow will check it.'
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/format-changed.py "$FORMAT_BASE" HEAD
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- apps/api apps/web
            git commit -m 'style: automatically format changed files'
            gh auth setup-git
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped') && needs.format.outputs.stale != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ needs.format.outputs.revision || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
      # Empty means same-origin requests through Nginx in the browser.
      NEXT_PUBLIC_API_URL: ""
      API_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.format.outputs.revision || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Test and build API
        working-directory: apps/api
        run: |
          go test ./...
          go vet ./...
          mkdir -p ../../dist/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../dist/api/server ./cmd/server

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint and build frontend
        working-directory: apps/web
        run: |
          npm run lint
          npm run build

      - name: Package release
        if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist/web dist/runtime
          cp -a apps/web/.next/standalone/. dist/web/
          cp -a apps/web/.next/static dist/web/.next/static
          cp -a apps/web/public dist/web/public
          cp "$(command -v node)" dist/runtime/node
          cp deploy/activate-release.sh dist/activate-release.sh
          printf '%s\n' "$RELEASE_SHA" > dist/REVISION
          tar -czf release.tar.gz -C dist .

      - name: Deploy and verify
        if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ vars.VPS_HOST || '129.121.128.135' }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_USER: ${{ vars.VPS_USER || 'banbunsi-deploy' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo 'Missing VPS_SSH_KEY secret'; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo 'Missing VPS_KNOWN_HOSTS secret'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/banbunsi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/banbunsi ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/banbunsi' EXIT
          ssh_args=(-i ~/.ssh/banbunsi -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$VPS_PORT")
          # A unique staging directory also isolates manual deployments.
          staging="/opt/banbunsi/incoming/${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$staging'"
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "cat > '$staging/release.tar.gz'" < release.tar.gz
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "tar -xzf '$staging/release.tar.gz' -C '$staging' && bash '$staging/activate-release.sh' '$staging' '$RELEASE_SHA'"
